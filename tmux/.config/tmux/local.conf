# Loaded last from Omarchy's XDG tmux config, so only intentional deltas live here.
# [D-TMUX-KEEP][D-CARRY-SET][F-TMUX-XDG]

# ── prefix ───────────────────────────────────────────────────────────────────
# Prefer the long-standing C-a prefix over Omarchy's C-Space.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── timing ───────────────────────────────────────────────────────────────────
# Avoid ESC delay in vim.
set -s escape-time 0

# ── clipboard ────────────────────────────────────────────────────────────────
# wl-copy bridges tmux copy-mode to the Wayland clipboard.
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy'

# ── panes ────────────────────────────────────────────────────────────────────
# Keep splits in the current pane directory and add prefix-based pane movement.
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -h -c "#{pane_current_path}"
bind -r ^ last-window
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# ── session picker ───────────────────────────────────────────────────────────
bind-key -r f run-shell "tmux neww tmux-sessionizer"
