# Loaded last from Omarchy's XDG tmux config, so only intentional deltas live here.
# [D-TMUX-KEEP][D-CARRY-SET][F-TMUX-XDG]

# ── prefix ───────────────────────────────────────────────────────────────────
# Prefer the long-standing C-a prefix over Omarchy's C-Space.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Omarchy's own tmux.conf already covers what used to live here: an identical
# copy-mode-vi `v` bind, a `y` that copies via OSC52 (set-clipboard on +
# terminal-features ",*:clipboard"), and escape-time 10 — close enough to 0 to
# be imperceptible in vim. Restating any of them would violate deltas-only.

# ── panes ────────────────────────────────────────────────────────────────────
# Keep splits in the current pane directory and add prefix-based pane movement.
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -h -c "#{pane_current_path}"
bind -r ^ last-window
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# ── session picker ───────────────────────────────────────────────────────────
bind-key -r f run-shell "tmux neww tmux-sessionizer"
