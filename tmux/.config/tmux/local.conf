# tmux — personal overlay (repo-owned). [D-TMUX-KEEP][D-CARRY-SET][F-TMUX-XDG]
# Stowed to ~/.config/tmux/local.conf and source-file'd LAST from Omarchy's
# ~/.config/tmux/tmux.conf (via the install managed block), so these OVERRIDE
# omarchy on conflict. We deliberately INHERIT omarchy's good defaults by NOT
# re-setting them: tmux-256color + *:RGB truecolor, mouse, 50k history,
# pane-base-index, renumber-windows, set-clipboard, extended-keys, the themed
# status bar, and the M-<n>/M-arrow window + C-M-arrow pane navigation.
# Only our intentional deltas are below.

# Prefix: C-a (replaces omarchy's C-Space)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Instant ESC (for vim)
set -s escape-time 0

# (Reload + kill-session use omarchy's defaults: prefix q = reload, prefix K = kill-session.)

# Vi-copy → Wayland clipboard (omarchy already sets mode-keys vi + set-clipboard)
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy'

# Vim-style splits (open in cwd, borrowed from omarchy) + prefix pane-nav
# (complements omarchy's no-prefix C-M-arrows)
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -h -c "#{pane_current_path}"
bind -r ^ last-window
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# tmux-sessionizer (kill-session uses omarchy's default: prefix K)
bind-key -r f run-shell "tmux neww tmux-sessionizer"
