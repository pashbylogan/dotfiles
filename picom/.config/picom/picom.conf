backend = "glx";
glx-no-stencil = true;
vsync = true;
use-damage = true;
unredir-if-possible = true;
mark-wmwin-focused = true;
detect-transient = true;

blur: {
  method = "dual_kawase";
  strength = 5;
  background = false;
  background-frame = false;
  background-fixed = false;
}

blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c",
  "class_i = 'com.mitchellh.ghostty'"
];
