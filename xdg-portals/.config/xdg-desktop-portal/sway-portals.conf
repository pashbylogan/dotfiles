# Route xdg-desktop-portal requests when running a sway session.
# - Screenshot + ScreenCast → wlr (wlroots native, works on Sway)
# - Inhibit → none (forces Firefox/Chromium to fall back to the native
#   Wayland idle-inhibit protocol instead of a D-Bus path that dead-ends
#   at org.gnome.SessionManager, which isn't running here)
# - Everything else (Settings, FileChooser, Notification, OpenURI...) → gtk
#   Settings in particular bridges our gsettings color-scheme to apps
#   that query the portal (Firefox, Chromium, Electron apps).
[preferred]
default=gtk
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Inhibit=none
