# Route xdg-desktop-portal requests when running a sway session.
# - Screenshot + ScreenCast → wlr (wlroots native, works on Sway)
# - Everything else (Settings, FileChooser, Notification, OpenURI...) → gtk
#   Settings in particular bridges our gsettings color-scheme to apps
#   that query the portal (Firefox, Chromium, Electron apps).
[preferred]
default=gtk
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.ScreenCast=wlr
