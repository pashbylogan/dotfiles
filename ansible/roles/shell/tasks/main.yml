---
# Shell role — zsh is installed by the packages role; config is stowed.
# Prompt is handled by starship (installed via packages role).
# No framework (oh-my-zsh) needed — completion, history, and keybindings
# are configured directly in .zshrc.

- name: Locate zsh binary
  ansible.builtin.shell: command -v zsh
  register: zsh_path
  changed_when: false

- name: Ensure zsh is listed in /etc/shells
  ansible.builtin.lineinfile:
    path: /etc/shells
    line: "{{ zsh_path.stdout }}"
    state: present
  become: true

- name: Set zsh as login shell for {{ ansible_facts.user_id }}
  ansible.builtin.user:
    name: "{{ ansible_facts.user_id }}"
    shell: "{{ zsh_path.stdout }}"
  become: true

- name: Configure git (delta pager + modern defaults)
  community.general.git_config:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    scope: global
  loop:
    # Delta as pager
    - { name: "core.pager", value: "delta" }
    - { name: "interactive.diffFilter", value: "delta --color-only" }
    - { name: "delta.navigate", value: "true" }
    - { name: "delta.line-numbers", value: "true" }
    - { name: "delta.syntax-theme", value: "base16" }
    - { name: "merge.conflictstyle", value: "diff3" }
    # Modern defaults (adopted from Omarchy; all upstream git recommended).
    - { name: "diff.algorithm", value: "histogram" }       # smarter hunking than myers
    - { name: "rerere.enabled", value: "true" }            # remember conflict resolutions
    - { name: "push.autoSetupRemote", value: "true" }      # no more --set-upstream
    - { name: "branch.sort", value: "-committerdate" }     # recent branches first in git branch
  loop_control:
    label: "{{ item.name }}"
