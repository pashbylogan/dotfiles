---
- name: Check stow packages exist
  ansible.builtin.stat:
    path: "{{ dotfiles_repo_root }}/{{ item }}"
  loop: "{{ dotfiles_stow_packages_resolved }}"
  loop_control:
    label: "{{ item }}"
  register: dotfiles_stow_package_stats

- name: Apply stow packages
  ansible.builtin.command:
    cmd: "stow -v -t {{ dotfiles_stow_target }} -R {{ item.item }}"
    chdir: "{{ dotfiles_repo_root }}"
  loop: "{{ dotfiles_stow_package_stats.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - dotfiles_mode != 'check'
    - item.stat.exists
  register: dotfiles_stow_apply
  changed_when: "'LINK:' in (dotfiles_stow_apply.stderr | default(''))"

- name: Restrict SSH config permissions
  ansible.builtin.file:
    path: "{{ dotfiles_stow_target }}/.ssh"
    state: directory
    mode: "0700"

- name: Restrict SSH config file permissions
  ansible.builtin.file:
    path: "{{ dotfiles_stow_target }}/.ssh/config"
    mode: "0600"
  when: dotfiles_mode != 'check'
