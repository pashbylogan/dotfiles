---
- name: Check if starship is installed
  ansible.builtin.stat:
    path: "{{ dotfiles_apps_root }}/bin/starship"
  register: dotfiles_starship_binary
  when: dotfiles_starship_enabled

- name: Install starship
  ansible.builtin.shell: |
    set -euo pipefail
    curl -fsSL https://starship.rs/install.sh | sh -s -- --yes --bin-dir "{{ dotfiles_apps_root }}/bin"
  args:
    executable: /bin/bash
  when:
    - dotfiles_starship_enabled
    - not dotfiles_starship_binary.stat.exists
  changed_when: true

- name: Update starship
  ansible.builtin.shell: |
    set -euo pipefail
    curl -fsSL https://starship.rs/install.sh | sh -s -- --yes --bin-dir "{{ dotfiles_apps_root }}/bin"
  args:
    executable: /bin/bash
  register: dotfiles_starship_update
  when:
    - dotfiles_starship_enabled
    - dotfiles_mode == "update"
    - dotfiles_starship_binary.stat.exists
  changed_when: "'is already installed' not in (dotfiles_starship_update.stderr | default(''))"

- name: Ensure uv directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ dotfiles_uv_root }}"
    - "{{ dotfiles_uv_bin_dir }}"
    - "{{ dotfiles_uv_root }}/tools"
    - "{{ dotfiles_uv_root }}/python"
    - "{{ dotfiles_uv_root }}/cache"
  when: dotfiles_uv_enabled

- name: Check if uv is installed
  ansible.builtin.stat:
    path: "{{ dotfiles_uv_bin_dir }}/uv"
  register: dotfiles_uv_binary
  when: dotfiles_uv_enabled

- name: Install or update uv
  ansible.builtin.shell: |
    set -euo pipefail
    curl -LsSf https://astral.sh/uv/install.sh | env \
      UV_UNMANAGED_INSTALL="{{ dotfiles_uv_bin_dir }}" \
      UV_INSTALL_DIR="{{ dotfiles_uv_bin_dir }}" \
      UV_NO_MODIFY_PATH=1 \
      sh
  args:
    executable: /bin/bash
  when:
    - dotfiles_uv_enabled
    - not dotfiles_uv_binary.stat.exists
  changed_when: true

- name: Update uv
  ansible.builtin.shell: |
    set -euo pipefail
    curl -LsSf https://astral.sh/uv/install.sh | env \
      UV_UNMANAGED_INSTALL="{{ dotfiles_uv_bin_dir }}" \
      UV_INSTALL_DIR="{{ dotfiles_uv_bin_dir }}" \
      UV_NO_MODIFY_PATH=1 \
      sh
  args:
    executable: /bin/bash
  register: dotfiles_uv_update
  when:
    - dotfiles_uv_enabled
    - dotfiles_mode == "update"
    - dotfiles_uv_binary.stat.exists
  changed_when: "'is already installed' not in (dotfiles_uv_update.stderr | default(''))"

- name: Check if fnm is installed
  ansible.builtin.stat:
    path: "{{ dotfiles_fnm_dir }}/fnm"
  register: dotfiles_fnm_binary
  when: dotfiles_fnm_enabled

- name: Install fnm
  ansible.builtin.shell: |
    set -euo pipefail
    curl -fsSL https://fnm.vercel.app/install | bash -s -- \
      --install-dir "{{ dotfiles_fnm_dir }}" \
      --skip-shell
  args:
    executable: /bin/bash
  when:
    - dotfiles_fnm_enabled
    - not dotfiles_fnm_binary.stat.exists
  changed_when: true

- name: Update fnm
  ansible.builtin.shell: |
    set -euo pipefail
    curl -fsSL https://fnm.vercel.app/install | bash -s -- \
      --install-dir "{{ dotfiles_fnm_dir }}" \
      --skip-shell
  args:
    executable: /bin/bash
  register: dotfiles_fnm_update
  when:
    - dotfiles_fnm_enabled
    - dotfiles_mode == "update"
    - dotfiles_fnm_binary.stat.exists
  changed_when: "'already installed' not in (dotfiles_fnm_update.stderr | default(''))"

- name: Check if Node.js LTS is installed
  ansible.builtin.shell: |
    set -euo pipefail
    export PATH="{{ dotfiles_fnm_dir }}:$PATH"
    eval "$(fnm env --shell bash)"
    fnm ls | grep -q lts-latest
  args:
    executable: /bin/bash
  register: dotfiles_node_check
  changed_when: false
  failed_when: false
  when:
    - dotfiles_fnm_enabled
    - dotfiles_node_lts_enabled

- name: Install Node.js LTS
  ansible.builtin.shell: |
    set -euo pipefail
    export PATH="{{ dotfiles_fnm_dir }}:$PATH"
    eval "$(fnm env --shell bash)"
    fnm install --lts
    installed="$(fnm ls | grep lts-latest | head -1 | awk '{print $2}')"
    [ -n "$installed" ] && fnm default "$installed"
  args:
    executable: /bin/bash
  when:
    - dotfiles_fnm_enabled
    - dotfiles_node_lts_enabled
    - dotfiles_node_check.rc != 0 or dotfiles_mode == 'update'
  register: dotfiles_node_install
  changed_when: "'already installed' not in (dotfiles_node_install.stderr | default(''))"

- name: Upgrade npm to latest
  ansible.builtin.shell: |
    set -euo pipefail
    export PATH="{{ dotfiles_fnm_dir }}:$PATH"
    eval "$(fnm env --shell bash)"
    npm install -g npm@latest
  args:
    executable: /bin/bash
  when:
    - dotfiles_fnm_enabled
    - dotfiles_node_lts_enabled
    - dotfiles_node_install is changed or dotfiles_mode == 'update'
  register: dotfiles_npm_upgrade
  changed_when: "'added' in (dotfiles_npm_upgrade.stdout | default('')) or 'updated' in (dotfiles_npm_upgrade.stdout | default(''))"

- name: Enable corepack
  ansible.builtin.shell: |
    set -euo pipefail
    export PATH="{{ dotfiles_fnm_dir }}:$PATH"
    eval "$(fnm env --shell bash)"
    corepack enable
  args:
    executable: /bin/bash
  when:
    - dotfiles_fnm_enabled
    - dotfiles_node_lts_enabled
  changed_when: false
