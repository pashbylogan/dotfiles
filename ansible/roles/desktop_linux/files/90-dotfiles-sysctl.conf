# Raise inotify watcher limit for webpack/VS Code/watchman/esbuild etc.
# The kernel default (8192) is easy to hit on modern JS projects.
fs.inotify.max_user_watches=524288

# Probe MTU on TCP path errors instead of hanging. Fixes intermittent SSH
# stalls over VPNs and hotspot paths that black-hole ICMP Fragmentation
# Needed.
net.ipv4.tcp_mtu_probing=1
