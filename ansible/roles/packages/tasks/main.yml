---
# Third-party repos (COPRs, etc.) are enabled here so `dnf install`
# below sees them in the same role.

- name: Ensure dnf-plugins-core is present (provides `dnf copr`)
  become: true
  ansible.builtin.package:
    name: dnf-plugins-core
    state: "{{ 'latest' if dotfiles_mode == 'update' else 'present' }}"
  when:
    - ansible_facts.system == "Linux"
    - dotfiles_pkg_mgr == "dnf"

- name: Enable required COPRs
  become: true
  ansible.builtin.command:
    cmd: "dnf -y copr enable {{ item }}"
    creates: "/etc/yum.repos.d/_copr:copr.fedorainfracloud.org:{{ item | replace('/', ':') }}.repo"
  loop: "{{ dotfiles_copr_repos | default([]) }}"
  when:
    - ansible_facts.system == "Linux"
    - dotfiles_pkg_mgr == "dnf"
    - dotfiles_resolved_profile == "linux_desktop"

- name: Install Fedora desktop hardware support baseline
  become: true
  ansible.builtin.dnf:
    name: "@hardware-support"
    state: "{{ 'latest' if dotfiles_mode == 'update' else 'present' }}"
  when:
    - ansible_facts.system == "Linux"
    - dotfiles_pkg_mgr == "dnf"
    - dotfiles_resolved_profile == "linux_desktop"

- name: Install Linux packages
  become: true
  when: ansible_facts.system == "Linux"
  block:
    - name: Install declared Linux packages
      ansible.builtin.package:
        name: "{{ dotfiles_linux_packages_resolved }}"
        state: "{{ 'latest' if dotfiles_mode == 'update' else 'present' }}"
