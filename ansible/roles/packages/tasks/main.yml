---
- name: Install Linux packages
  become: true
  when: ansible_system == "Linux"
  block:
    - name: Install declared Linux packages
      ansible.builtin.package:
        name: "{{ dotfiles_linux_packages_resolved }}"
        state: "{{ 'latest' if dotfiles_mode == 'update' else 'present' }}"

- name: Provide dex compatibility shim when distro installs dex-autostart
  ansible.builtin.file:
    src: /usr/bin/dex-autostart
    dest: "{{ dotfiles_local_bin_dir }}/dex"
    state: link
  when:
    - ansible_system == "Linux"
    - dotfiles_pkg_mgr | default(ansible_pkg_mgr) == "dnf"
    - dotfiles_resolved_profile == "linux_desktop"
