---
# Fedora-only support note:
# We intentionally keep only the dnf repo bootstrap path here.
# The previously removed apt block was part of now-removed multi-distro support.

- name: Check if Tailscale is installed
  ansible.builtin.command: tailscale --version
  register: dotfiles_tailscale_check
  changed_when: false
  failed_when: false
  when:
    - dotfiles_tailscale_enabled
    - ansible_facts.system == "Linux"

- name: Add Tailscale dnf repo (Fedora-only)
  become: true
  when:
    - dotfiles_tailscale_enabled
    - ansible_facts.system == "Linux"
    - dotfiles_pkg_mgr == "dnf"
    - dotfiles_tailscale_check.rc != 0
  block:
    - name: Add Tailscale yum repo
      ansible.builtin.get_url:
        url: "https://pkgs.tailscale.com/stable/fedora/tailscale.repo"
        dest: /etc/yum.repos.d/tailscale.repo
        mode: "0644"

- name: Install Tailscale
  become: true
  ansible.builtin.package:
    name: tailscale
    state: "{{ 'latest' if dotfiles_mode == 'update' else 'present' }}"
  when:
    - dotfiles_tailscale_enabled
    - ansible_facts.system == "Linux"
