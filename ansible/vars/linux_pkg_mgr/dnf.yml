---
# Abstract-name → concrete package list for Fedora.
# Only list entries where the installed package name differs from the
# abstract name or where one abstract name expands to several packages.
# Abstract names not in this map resolve to themselves — see the
# `Resolve Linux package list` task in ansible/site.yml.
dotfiles_linux_pkg_map:
  delta:
    - git-delta
  netcat:
    - nmap-ncat
  openssh_client:
    - openssh-clients
  wireguard_tools:
    - wireguard-tools
  build_tools:
    - gcc
    - gcc-c++
    - make
  fd:
    - fd-find
  python:
    - python3
    - python3-pip
  wl_clipboard:
    - wl-clipboard
  mako_notifier:
    - mako
  xdg_desktop_portal:
    - xdg-desktop-portal
  xdg_desktop_portal_wlr:
    - xdg-desktop-portal-wlr
  xdg_desktop_portal_gtk:
    - xdg-desktop-portal-gtk
  pipewire_pulse:
    - pipewire-pulseaudio
  pipewire_alsa:
    - pipewire-alsa
  pipewire_jack:
    - pipewire-jack-audio-connection-kit
  power_profiles_daemon:
    - power-profiles-daemon
  dex:
    - dex-autostart
  nm_applet:
    - network-manager-applet
  nerd_fonts:
    - cascadia-mono-nf-fonts
  noto_color_emoji_fonts:
    - google-noto-color-emoji-fonts
  noto_sans_cjk_fonts:
    - google-noto-sans-cjk-vf-fonts
  adwaita_icon_theme:
    - adwaita-icon-theme
  mate_polkit:
    - mate-polkit
  gnome_keyring:
    - gnome-keyring
  gvfs_mtp:
    - gvfs-mtp
  gvfs_smb:
    - gvfs-smb
  gvfs_nfs:
    - gvfs-nfs
  webp_pixbuf_loader:
    - webp-pixbuf-loader
  zram_generator_defaults:
    - zram-generator-defaults
