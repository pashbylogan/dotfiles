---
dotfiles_mode: apply
dotfiles_profile: auto
dotfiles_repo_root: "{{ playbook_dir | dirname }}"
dotfiles_stow_target: "{{ ansible_facts.env.HOME }}"
dotfiles_apps_root: "{{ ansible_facts.env.HOME }}/apps"
dotfiles_local_bin_dir: "{{ ansible_facts.env.HOME }}/.local/bin"
dotfiles_local_scripts_dir: "{{ ansible_facts.env.HOME }}/.local/scripts"
dotfiles_share_root: "{{ ansible_facts.env.HOME }}/.local/share"
dotfiles_stow_packages_common:
  - ssh
  - nvim
  - tmux
  - zsh
  - bin
  - lib
  - ghostty

dotfiles_stow_packages_linux_desktop:
  - sway
  - waybar
  - mako
  - kanshi
  - gtk
  - wireplumber
  - systemd
  - fontconfig
  - xdg-portals

dotfiles_common_linux_packages:
  - git
  - curl
  - ca-certificates
  - stow
  - zsh
  - tmux
  - neovim
  - fzf
  - ripgrep
  - fd
  - age
  - gh
  - delta
  - which
  - unzip
  - jq
  - rsync
  - netcat
  - lsof
  - patch
  - tar
  - openssh_client
  - wireguard_tools
  - build_tools
  - python
  - go

dotfiles_starship_enabled: true
dotfiles_tailscale_enabled: true
# Third-party COPRs enabled by the packages role before package install.
# See docs/design-history.md §28 (rationale) and §29 (Fedora 44 switch) for
# why each one is required.
dotfiles_copr_repos:
  - erikreider/packages   # swayosd (volume/brightness/caps OSD) — see §29
  - scottames/ghostty     # ghostty terminal — listed on ghostty.org Fedora install page, see §29

dotfiles_uv_enabled: true
dotfiles_uv_root: "{{ dotfiles_apps_root }}/uv"
dotfiles_uv_bin_dir: "{{ dotfiles_uv_root }}/bin"
dotfiles_fnm_enabled: true
dotfiles_fnm_dir: "{{ dotfiles_apps_root }}/fnm"
dotfiles_node_lts_enabled: true
