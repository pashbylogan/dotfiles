[defaults]
inventory = ./inventory/hosts.yml
retry_files_enabled = False
interpreter_python = auto_silent
# Modern Ansible practice — facts live under `ansible_facts.*` only, never
# injected as top-level `ansible_*` variables. Default flips to False in a
# future release; opting in early silences the deprecation banner and keeps
# our playbook forward-compatible.
inject_facts_as_vars = False

[privilege_escalation]
become_ask_pass = True
