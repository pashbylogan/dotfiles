---
- name: Converge local machine to dotfiles state
  hosts: localhost
  connection: local
  gather_facts: true
  gather_subset:
    - min
    - pkg_mgr

  pre_tasks:
    - name: Resolve profile
      ansible.builtin.set_fact:
        dotfiles_resolved_profile: >-
          {{
            dotfiles_profile
            if dotfiles_profile != 'auto'
            else 'linux_desktop'
          }}

    - name: Validate profile
      ansible.builtin.assert:
        that:
          - dotfiles_resolved_profile == 'linux_desktop'
        fail_msg: "Invalid profile: {{ dotfiles_resolved_profile }}"

    - name: Validate supported OS
      ansible.builtin.assert:
        that:
          - ansible_system == 'Linux'
        fail_msg: "Unsupported OS: {{ ansible_system }}. This repo supports Fedora Linux only."

    - name: Load profile variables
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/vars/profiles/{{ dotfiles_resolved_profile }}.yml"

    - name: Normalize package manager name
      ansible.builtin.set_fact:
        dotfiles_pkg_mgr: >-
          {{ 'dnf' if ansible_pkg_mgr in ['dnf', 'dnf5'] else ansible_pkg_mgr }}
      when: ansible_system == "Linux"

    - name: Validate package manager (Fedora Linux only)
      ansible.builtin.assert:
        that:
          - dotfiles_pkg_mgr == 'dnf'
        fail_msg: "Unsupported Linux package manager: {{ dotfiles_pkg_mgr }}. This repo supports Fedora Linux (dnf/dnf5) only."
      when: ansible_system == "Linux"

    - name: Load Linux package-manager map
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/vars/linux_pkg_mgr/{{ dotfiles_pkg_mgr }}.yml"
      when: ansible_system == "Linux"

    - name: Resolve Linux package list
      # Names in the map resolve to their mapped concrete package(s);
      # names missing from the map resolve to themselves. Keep a map
      # entry only when the abstract name differs from the installed
      # name or expands to multiple packages.
      vars:
        _names: "{{ dotfiles_common_linux_packages + dotfiles_profile_linux_packages_common }}"
      ansible.builtin.set_fact:
        dotfiles_linux_packages_resolved: >-
          {{
            (_names | select('in', dotfiles_linux_pkg_map) | map('extract', dotfiles_linux_pkg_map) | flatten | list)
            + (_names | reject('in', dotfiles_linux_pkg_map) | list)
          }}
      when: ansible_system == "Linux"

    - name: Resolve stow package list
      ansible.builtin.set_fact:
        dotfiles_stow_packages_resolved: >-
          {{
            dotfiles_stow_packages_common
            + (
              dotfiles_stow_packages_linux_desktop
              if dotfiles_resolved_profile == 'linux_desktop'
              else []
            )
          }}

  roles:
    - role: filesystem
    - role: packages
    - role: user_tools
    - role: shell
    - role: stow
    - role: tailscale
    - role: desktop_linux
      when: dotfiles_resolved_profile == "linux_desktop"
