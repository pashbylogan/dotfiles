---
- name: Converge local machine to dotfiles state
  hosts: localhost
  connection: local
  gather_facts: true

  pre_tasks:
    - name: Resolve profile
      ansible.builtin.set_fact:
        dotfiles_resolved_profile: >-
          {{
            dotfiles_profile
            if dotfiles_profile != 'auto'
            else ('macos_cli' if ansible_system == 'Darwin' else 'linux_desktop')
          }}

    - name: Load profile variables
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/vars/profiles/{{ dotfiles_resolved_profile }}.yml"

    - name: Normalize package manager name
      ansible.builtin.set_fact:
        dotfiles_pkg_mgr: >-
          {{ 'dnf' if ansible_pkg_mgr in ['dnf', 'dnf5'] else ansible_pkg_mgr }}
      when: ansible_system == "Linux"

    - name: Load Linux package-manager map
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/vars/linux_pkg_mgr/{{ dotfiles_pkg_mgr }}.yml"
      when: ansible_system == "Linux"

    - name: Resolve Linux package list
      ansible.builtin.set_fact:
        dotfiles_linux_packages_resolved: >-
          {{
            (
              dotfiles_common_linux_packages
              + dotfiles_profile_linux_packages_common
            )
            | map('extract', dotfiles_linux_pkg_map)
            | flatten
          }}
      when: ansible_system == "Linux"

    - name: Resolve stow package list
      ansible.builtin.set_fact:
        dotfiles_stow_packages_resolved: >-
          {{
            dotfiles_stow_packages_common
            + (
              dotfiles_stow_packages_linux_desktop
              if dotfiles_resolved_profile == 'linux_desktop'
              else []
            )
          }}

  roles:
    - role: filesystem
    - role: packages
    - role: user_tools
    - role: shell
    - role: stow
    - role: desktop_linux
      when: dotfiles_resolved_profile == "linux_desktop"
    - role: macos_cli
      when: dotfiles_resolved_profile == "macos_cli"
