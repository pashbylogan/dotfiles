# Sourced last from the install-managed Hyprland block, so repo deltas win.
# Keep device-specific input tweaks in hypr.local.conf. [D-DELTA-STORAGE][F-HYPR-SEAM]

# Override only kb_options so Omarchy's detected layout stays intact. [D-CAPS-CTRL]
input {
    kb_options = compose:caps,ctrl:nocaps
}

# Some app classes may be absent after Remove Preinstalled; unmatched rules are harmless. [D-WORKSPACE-RULES]
windowrule = workspace 1, match:class (Alacritty|com.mitchellh.ghostty|kitty|foot)
windowrule = workspace 2, match:class (brave-origin)
windowrule = workspace 3, match:class (Slack|obsidian)
windowrule = workspace 5, match:class (jetbrains-idea)
windowrule = workspace 10, match:class (Spotify|spotify)

# All Slack windows share class=slack, so we float only the huddle by title;
# float is static, so this matches its initialTitle "Slack - Huddle Preview". [D-SLACK-HUDDLE-FLOAT]
windowrule = float on, match:class slack, match:title Huddle

# Compact look, sourced last so it beats the window-no-gaps toggle: slim gaps;
# border_size restates Omarchy's default so the toggle can't drop borders. [D-LOOKNFEEL]
general {
    gaps_in = 2
    gaps_out = 4
    border_size = 2
}
# Round all corners at Omarchy's recommended radius; frosted-glass blur shows
# only through transparent surfaces, so opaque apps are unaffected. [D-LOOKNFEEL]
decoration {
    rounding = 8
    blur {
        size = 8
        brightness = 0.72
    }
}
# Reuses Omarchy's `terminal` tag; our overlay sources last so this opacity
# wins. Kept mild so text stays readable, including on lighter themes. [D-LOOKNFEEL]
windowrule = opacity 0.86 0.78, match:tag terminal

# Omarchy sets focus_on_activate = true; we invert it (Hyprland's default) so an
# activation request marks the window urgent instead of stealing focus. [D-LOOKNFEEL]
misc {
    focus_on_activate = false
}

# Personal keybinds live here so Omarchy defaults stay updateable and every
# conflict has a docs ledger entry. [D-KEYBIND-OVERRIDES]
unbind = SUPER ALT, SPACE
unbind = SUPER, D
bindd = SUPER, D, Omarchy menu, exec, omarchy-menu

unbind = SUPER, I
unbind = SUPER, E
bindd = SUPER, I, Show key bindings, exec, omarchy-menu-keybindings
bindd = SUPER, E, Toggle workspace layout, exec, omarchy-hyprland-workspace-layout-toggle

unbind = SUPER, H
unbind = SUPER, J
unbind = SUPER, K
unbind = SUPER, L
bindd = SUPER, H, Focus on left window, movefocus, l
bindd = SUPER, J, Focus on below window, movefocus, d
bindd = SUPER, K, Focus on above window, movefocus, u
bindd = SUPER, L, Focus on right window, movefocus, r

unbind = SUPER SHIFT, H
unbind = SUPER SHIFT, J
unbind = SUPER SHIFT, K
unbind = SUPER SHIFT, L
bindd = SUPER SHIFT, H, Swap window to the left, swapwindow, l
bindd = SUPER SHIFT, J, Swap window down, swapwindow, d
bindd = SUPER SHIFT, K, Swap window up, swapwindow, u
bindd = SUPER SHIFT, L, Swap window to the right, swapwindow, r

unbind = SUPER SHIFT, PERIOD
bindd = SUPER SHIFT, PERIOD, Move workspace to next monitor, movecurrentworkspacetomonitor, +1

# Fallback while the keyboard's PRINT key emits no Linux input event. [D-SCREENSHOT-FALLBACK]
bindd = SUPER SHIFT, S, Screenshot, exec, omarchy-capture-screenshot

# Kinesis Calc thumb key sends F14 (evdev 184); bind by keycode (X 192 = 184 + 8)
# because F13+ keysyms map unreliably through xkb. Home is remapped to Tab on the
# keyboard directly. [D-KINESIS-REMAP]
bindd = , code:192, Clipboard history, exec, omarchy-launch-walker -m clipboard

# Known external displays. eDP-1 deliberately has no rule here: this overlay
# loads after ~/.local/state/omarchy/toggles/hypr/, so an explicit eDP-1 rule
# would clobber omarchy's lid-switch toggle. [D-MONITORS]
monitor = desc:Acer Technologies XV272U 0x01822E61, 2560x1440@144, 0x0, 1.333333
monitor = desc:Acer Technologies XV272U V 332506A1C3LIJ, 2560x1440@144, 1920x0, 1.333333
monitor = desc:Dell Inc. DELL U2719DC GGBR4N2, 2560x1440@59.95, 0x0, 1.25
