# hypr.conf — personal Hyprland overlay (repo-owned).
# Sourced LAST from ~/.config/hypr/hyprland.conf via the `install` managed block,
# so these override Omarchy's defaults. [D-DELTA-STORAGE][F-HYPR-SEAM]
# Device-specific bits (e.g. external mouse acceleration) go in hypr.local.conf.
#
# Syntax note: this mirrors the `windowrule = <rule>, match:class <regex>` form
# Omarchy uses in its own seeded hypr files on this version. If Omarchy moves to
# Lua config, port this file to a Lua module + swap the one source line. [F-LUA]

# [D-CAPS-CTRL] Caps Lock -> Control. Omarchy auto-detects kb_layout from
# /etc/vconsole.conf (install/config/detect-keyboard-layout.sh), so we override
# ONLY kb_options here (Hyprland merges input{} blocks; layout is preserved).
input {
    kb_options = compose:caps,ctrl:nocaps
}

# [D-WORKSPACE-RULES] Pin apps to workspaces.
# Verify/adjust class names with `hyprctl clients` (browser may be Zen/Brave/Chrome;
# some apps were removed by "Remove Preinstalled" and simply won't match — harmless).
windowrule = workspace 1, match:class (Alacritty|com.mitchellh.ghostty|kitty|foot)
windowrule = workspace 2, match:class (firefox|zen|zen-alpha|brave-browser|chromium|Google-chrome)
windowrule = workspace 3, match:class (Slack|obsidian)
windowrule = workspace 5, match:class (jetbrains-idea)
windowrule = workspace 10, match:class (Spotify|spotify)
