# Sourced last from the install-managed Hyprland block, so repo deltas win.
# Keep device-specific input tweaks in hypr.local.conf. [D-DELTA-STORAGE][F-HYPR-SEAM]

# Override only kb_options so Omarchy's detected layout stays intact. [D-CAPS-CTRL]
input {
    kb_options = compose:caps,ctrl:nocaps
}

# Some app classes may be absent after Remove Preinstalled; unmatched rules are harmless. [D-WORKSPACE-RULES]
windowrule = workspace 1, match:class (Alacritty|com.mitchellh.ghostty|kitty|foot)
windowrule = workspace 2, match:class (firefox|zen|zen-alpha|brave-browser|chromium|Google-chrome)
windowrule = workspace 3, match:class (Slack|obsidian)
windowrule = workspace 5, match:class (jetbrains-idea)
windowrule = workspace 10, match:class (Spotify|spotify)

# Re-set only because window-no-gaps loads later than Omarchy defaults and
# zeroes borders; make verify checks this value still matches upstream. [D-LOOKNFEEL]
general {
    border_size = 2
}
# Floats round; tiles keep Omarchy's square default. This follows Omarchy's
# windowrule grammar, but matches float state instead of popup tags. [D-LOOKNFEEL]
windowrule = rounding 8, match:float 1

# btop dropped (packages.remove.txt); rebind SUPER+T to gnome-system-monitor.
# `bindd` (not `bind`) so it shows in omarchy's keybind cheatsheet. [D-PKG-REMOVE]
unbind = SUPER, T
unbind = SUPER CTRL, T
bindd = SUPER, T, Process monitor, exec, uwsm-app -- gnome-system-monitor

# Docked dual-Acer layout. eDP-1 deliberately has no rule here: this overlay
# loads after ~/.local/state/omarchy/toggles/hypr/, so an explicit eDP-1 rule
# would clobber omarchy's lid-switch toggle. [D-MONITORS]
monitor = desc:Acer Technologies XV272U 0x01822E61, 2560x1440@144, 0x0, 1.333333
monitor = desc:Acer Technologies XV272U V 332506A1C3LIJ, 2560x1440@144, 1920x0, 1.333333
