<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Fallbacks for CSS `system-ui` / `-apple-system` / `BlinkMacSystemFont`.
  Without these, sites that ask for the macOS system font stack fall
  through to a serif on Linux. Maps them to Liberation Sans (portable,
  ships with most distros) and Noto Color Emoji. Adapted from Omarchy.
-->
<fontconfig>
  <alias>
    <family>system-ui</family>
    <prefer>
      <family>Liberation Sans</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias>
    <family>-apple-system</family>
    <prefer>
      <family>Liberation Sans</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias>
    <family>BlinkMacSystemFont</family>
    <prefer>
      <family>Liberation Sans</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
</fontconfig>
