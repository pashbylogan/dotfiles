# Use software (userspace) volume control on ALSA cards.
# Gives consistent volume behaviour across cards, and is required for
# smooth per-app volume when the hardware mixer is limited. Omarchy
# default; see https://github.com/basecamp/omarchy.
monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
]
